<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Reset Password — DapperDriver</title>
  <style>
    :root { --blue:#1E66CA; --charcoal:#0C1A2E; --offwhite:#F5F7FC; --border:#D0E4FF; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--offwhite); color: var(--charcoal);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: #fff; border: 1px solid var(--border); border-radius: 18px;
      padding: 36px 32px; width: 100%; max-width: 420px;
      box-shadow: 0 18px 44px rgba(12,26,46,.08);
    }
    .brand { font-weight: 800; letter-spacing: 2px; font-size: 13px; color: var(--blue); text-transform: uppercase; margin-bottom: 18px; }
    h1 { font-size: 22px; margin-bottom: 6px; }
    p.sub { font-size: 13px; color: #5A6B84; margin-bottom: 22px; line-height: 1.5; }
    label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #5A6B84; margin: 14px 0 6px; }
    input {
      width: 100%; background: #fff; border: 1.5px solid var(--border); border-radius: 14px;
      padding: 13px 14px; font-size: 15px; color: var(--charcoal); outline: none;
    }
    input:focus { border-color: var(--blue); }
    button {
      width: 100%; margin-top: 22px; padding: 14px; border: none; border-radius: 14px;
      background: var(--blue); color: #fff; font-size: 14px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
    .msg { margin-top: 16px; font-size: 13px; line-height: 1.5; display: none; }
    .msg.err { color: #C62828; display: block; }
    .msg.ok  { color: #1B7B3A; display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">D.D — DapperDriver</div>
    <h1>Set a new password</h1>
    <p class="sub">Enter a new password for your DapperDriver account, then sign back in inside the app.</p>
    <div id="form">
      <label for="pw">New password</label>
      <input id="pw" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters">
      <label for="pw2">Confirm password</label>
      <input id="pw2" type="password" autocomplete="new-password" minlength="8" placeholder="Repeat it">
      <button id="submit">Update password</button>
    </div>
    <div id="msg" class="msg"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    // Anon key is a PUBLIC client credential by design (same one shipped in the app).
    const supabase = window.supabase.createClient(
      'https://iqryvxepigcqpxokgbtj.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlxcnl2eGVwaWdjcXB4b2tnYnRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwOTc4NzksImV4cCI6MjA4ODY3Mzg3OX0.orq5AZiicdEvt05o6LA7pkl3zbCs4DZ2vQjD9S0e-Pk'
    );
    const msg = document.getElementById('msg');
    const form = document.getElementById('form');
    const btn = document.getElementById('submit');
    function show(kind, text) { msg.className = 'msg ' + kind; msg.textContent = text; }

    // Supabase delivers the recovery session in the URL fragment; the JS client
    // picks it up automatically (detectSessionInUrl). PASSWORD_RECOVERY fires
    // when the token is valid.
    let ready = false;
    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) ready = true;
    });
    // Fallback check shortly after load — an expired/missing token never signs in.
    setTimeout(async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session && !ready) {
        form.style.display = 'none';
        show('err', 'This reset link is invalid or has expired. Request a new one from the app’s "Forgot password" screen.');
      }
    }, 1500);

    btn.addEventListener('click', async () => {
      const pw = document.getElementById('pw').value;
      const pw2 = document.getElementById('pw2').value;
      if (pw.length < 8) return show('err', 'Password must be at least 8 characters.');
      if (pw !== pw2) return show('err', 'Passwords don’t match.');
      btn.disabled = true;
      const { error } = await supabase.auth.updateUser({ password: pw });
      if (error) {
        btn.disabled = false;
        show('err', error.message || 'Could not update the password. Request a new reset link and try again.');
      } else {
        form.style.display = 'none';
        show('ok', '✓ Password updated. Open the DapperDriver app and sign in with your new password.');
        supabase.auth.signOut();
      }
    });
  </script>
</body>
</html>
